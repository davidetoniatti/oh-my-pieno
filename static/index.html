<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title data-i18n="title">Fuel Prices</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta name="theme-color" content="#ffffff" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=DM+Sans:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    />
    <link rel="stylesheet" href="/css/style.css" />
  </head>
  <body>
    <div id="app">
      <!-- Top Bar -->
      <header id="topbar">
        <div id="logo-container">
          <div id="logo">
            <span class="logo-text">OHMY<em>PIENO</em></span>
          </div>
          <span class="beta-tag">BETA</span>
        </div>

        <div id="controls-container">
          <div class="search-wrap">
            <input
              type="text"
              id="addressSearch"
              data-i18n-placeholder="search_placeholder"
              placeholder="City or address..."
              autocomplete="off"
            />
            <div
              id="searchSuggestions"
              class="suggestions-dropdown hidden"
            ></div>
            <button id="searchBtn" aria-label="Search">
              <svg
                width="14"
                height="14"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="3"
              >
                <circle cx="11" cy="11" r="8" />
                <path d="m21 21-4.3-4.3" />
              </svg>
            </button>
          </div>

          <div id="desktopControlsSlot"></div>

          <div id="action-buttons">
            <button id="filterToggle" aria-label="Toggle filters">
              <svg
                width="18"
                height="18"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
              >
                <path d="M22 3H2l8 9.46V19l4 2v-8.54L22 3z" />
              </svg>
            </button>

            <button
              id="historyToggle"
              class="history-btn"
              aria-label="Show history"
            >
              <svg
                width="18"
                height="18"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
              >
                <path d="M12 8v4l3 3" />
                <circle cx="12" cy="12" r="9" />
              </svg>
            </button>

            <button
              id="favoritesToggle"
              class="history-btn"
              aria-label="Show favorites"
            >
              <svg
                width="18"
                height="18"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
              >
                <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z" />
              </svg>
            </button>
          </div>
        </div>
      </header>

      <div id="mobileControlsSlot"></div>

      <!-- Map -->
      <div id="map-container">
        <div id="map"></div>
        <button id="searchHereBtn" class="hidden" data-i18n="search_here">
          Search this area
        </button>
        <button
          id="locateBtn"
          data-i18n-title="locate_title"
          title="Use my position"
        >
          <svg
            width="20"
            height="20"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2.5"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <circle cx="12" cy="12" r="7" />
            <circle cx="12" cy="12" r="1.5" fill="currentColor" stroke="none" />
            <path d="M12 3v3M12 18v3M3 12h3M18 12h3" />
          </svg>
        </button>
      </div>

      <!-- Detail Panel -->
      <div id="panel" class="hidden">
        <div class="sheet-header">
          <div class="sheet-handle"></div>
        </div>
        <button
          id="panelClose"
          class="desktop-only-close"
          type="button"
          aria-label="Close details"
        >
          <svg
            width="20"
            height="20"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2.5"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
        </button>
        <div id="panelContent" class="scrollable-content">
          <div class="panel-loading">
            <div class="spinner"></div>
            <p data-i18n="loading_details">Loading details...</p>
          </div>
        </div>
      </div>

      <div id="historyPanel" class="hidden">
        <div class="sheet-header">
          <div class="sheet-handle"></div>
        </div>
        <button
          id="historyPanelClose"
          class="desktop-only-close"
          type="button"
          aria-label="Close history"
        >
          <svg
            width="20"
            height="20"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2.5"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
        </button>
        <div id="historyPanelContent" class="scrollable-content">
          <div class="section-title" data-i18n="recent_title">
            RECENT STATIONS
          </div>
          <ul id="historyList"></ul>
        </div>
      </div>

      <!-- Favorites Panel -->
      <div id="favoritesPanel" class="hidden">
        <div class="sheet-header">
          <div class="sheet-handle"></div>
        </div>
        <button
          id="favoritesPanelClose"
          class="desktop-only-close"
          type="button"
          aria-label="Close favorites"
        >
          <svg
            width="20"
            height="20"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2.5"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
        </button>
        <div id="favoritesPanelContent" class="scrollable-content">
          <div class="section-title" data-i18n="favorites_title">
            FAVORITES
          </div>
          <ul id="favoritesList"></ul>
        </div>
      </div>

      <div id="help-indicator">
        <div class="helpindicator-title">
          <span data-i18n="press">PRESS</span> <kbd>?</kbd>
          <span data-i18n="for_help">FOR HELP</span>
        </div>
      </div>

      <div id="controls" class="mobile-hidden">
        <div class="select-wrap">
          <select id="fuelSelect">
            <option value="" data-i18n="loading">Loading...</option>
          </select>
        </div>
        <div class="select-wrap">
          <select id="brandSelect">
            <option value="" data-i18n="brand_all">All brands</option>
          </select>
        </div>
        <div class="select-wrap">
          <select id="radiusSelect">
            <option value="2">2 km</option>
            <option value="5" selected>5 km</option>
            <option value="10">10 km</option>
            <option value="20">20 km</option>
          </select>
        </div>
        <button
          id="helpBtn"
          type="button"
          class="mobile-only"
          data-i18n="settings_btn_label"
          data-i18n-title="settings_title"
        >
          Settings
        </button>
        <div class="sheet-header">
          <div class="sheet-handle"></div>
        </div>
      </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script type="module" src="js/app.js"></script>
  </body>
</html>
